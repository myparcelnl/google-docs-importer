name: 'Run tests 🧪'

on:
  workflow_call:

  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true

      - name: 'Run tests with coverage'
        run: |
          pnpm test:coverage

      - name: 'Upload coverage'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
